name=Model for Leaf Spot in Blackcurrant
description=<p>The model indicates whether there is a risk of infection by the fungus\u202f<em>Mycosphaerella ribis</em>, which causes Mycosphaerella leaf spot in blackcurrant. The model is likely also suitable for forecasting infection by\u202f<em>Drepanopeziza ribis</em>, which causes anthracnose and leaf drop in the same crop. The two fungi have very similar life cycles and overlapping periods for spore dispersal and infection. There is considerable variation in susceptibility to Mycosphaerella leaf spot among blackcurrant cultivars used in Norway, but important cultivars such as \u2018Ben Tron\u2019 and \u2018Ben Nare\u2019 are highly susceptible.</p>\n<p><em>Mycosphaerella ribis</em> overwinters as fruiting bodies in old leaves on the ground, where ascospores are formed and will be dispersed by wind during moist weather in spring. It also overwinters in old berry cluster stalks that remain on the bushes after machine harvesting, and from these, conidiospores (conidia) are splash dispersed by rain or overhead irrigation. The model describes spore maturation and the periods when dispersal of both ascospores and conidia may occur, which to a large extent happens during the same period in spring. At the same time, the model indicates when infection risk is present.\u00a0</p>\n<p>{{filename="/images/description_figure_1.png" description="Fotografier av b\u00e6rbuskbladflekk i solb\u00e6r"}}</p>\n<p><em>Fig 1. Leaf spot on fresh leaves (A). In spring, infection arises from ascospores produced in fruiting bodies in old leaves on the ground (B), and from conidia produced on old berry cluster stalks on the shoots (C). Photos: A. Stensvand.</em></p>\n<p>Spores are normally dispersed from before bud break until mid-June, although this varies somewhat between years. The most important period of spore dispersal is typically from a couple of weeks before to a couple of weeks after flowering. Maturation of both spore types in overwintered plant material depends on moisture. If there are extended periods without precipitation and moist conditions, maturation will therefore slow down or stop. Such dry periods are accounted for in the model. There is a diurnal rhythm in ascospore dispersal, with minimal dispersal at night. This is not adjusted for in the model because dispersal of conidia is not affected by light.</p>\n<p>Moisture is required for infection, and the infection period depends on temperature, with the shortest infection time occurring around 20\u00b0C. No separate infection model has been developed for <em>M. ribis</em>, but we use the same model as for apple scab (<em>Venturia inaequalis</em>), because the two fungi are closely related and presumably have similar infection dynamics.</p>\n<h2>Interpretation of the Forecast</h2>\n<p>Green indicates periods with no infection risk. Yellow indicates periods where some spores have been dispersed, and that infection is beginning or may have occurred. \u201cSome\u201d spore dispersal means that less than 3% of the spores (relative to the amount predicted for the entire season) have matured since the previous dispersal event. Red indicates that enough spores (\u2265 3% of the seasonal total) have matured and potentially been dispersed for a significant infection event, and that weather conditions may have allowed infection. The size (width) of the yellow and red bars indicates how long the moist conditions have been suitable for infection. The actual infection risk depends on how many spores that may have been dispersed when precipitation and moisture occur. The inoculum pressure in a given field is decisive and depends on the level of infection the previous year. The model is updated daily and shows a forecast based on recorded weather data and a 2\u2011day weather forecast.</p>\n<p>{{filename="/images/description_figure_2_en.png" description="Diagram med resultater fra varslingsmodell for b\u00e6rbuskbladflekk i solb\u00e6r"}}</p>\n<p><em>Fig. 2. Forecast model for Mycosphaerella leaf spot using data from a weather station in Southern Norway in 2025: Percentage maturation of ascospores from old leaves (dark blue line) and conidiospores from old berry cluster stalks (light blue line); when accumulated infection risk based on temperature and leaf wetness (black line) crosses the yellow and red horizontal lines, there is moderate (yellow vertical area) or high (red vertical area) infection risk (measured as Risk Value).\u00a0</em></p>\n<h2>Forecasting Season</h2>\n<p>Forecasting begins around bud break and ends shortly after spore dispersal from overwintered plant material has finished, usually in June. No forecasts are given for secondary infections, i.e., those caused by conidia produced in newly infected (current season) plant material.</p>\n<h2>Connecting Weather Stations</h2>\n<p>Contact VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) if you would like the model to be enabled for weather stations in your area. Forecasts are automatically displayed in the map function on the VIPS front page for all weather stations where the model is activated. The model can also be set up as a private forecast with user\u2011defined start and end dates. This can be done for private weather stations and for stations already included in the LMT database. See the user guide.</p>\n<h2>Testing and Validation of the Model</h2>\n<p>The model for blackcurrant leaf spot was developed in Norway and is based on data on spore maturation and dispersal under Norwegian conditions, but it has been compared with similar studies of <em>M. ribis</em> in other countries. The sub\u2011models for ascospore and conidiospore maturation/dispersal have been validated under Norwegian conditions. Since we use infection data developed for the apple scab fungus to forecast infection by <em>M. ribis</em>, there is some uncertainty as to whether it provides a fully accurate picture of infection risk. However, in most cases, moist periods are sufficiently long for the infection risk to be real. There will nevertheless always be significant local variation in moisture after rainfall, which introduces some degree of uncertainty.</p>\n<h2>Reference</h2>\n<p>Stensvand, A., Eikemo, H. &amp; Hjelkrem, A.-G., R. 2026. <em>Mycosphaerella ribis</em> in blackcurrant and patterns of spore release from overwintering sources of inoculum. Plant Disease. <a href="https://doi.org/10.1094/PDIS-08-25-1675-RE ">https://doi.org/10.1094/PDIS-08-25-1675-RE </a></p>\n<p>Stensvand, A., Eikemo, H., Hjelkrem, A.-G., R., Skog, T.-E. 2026. Varslingsmodell for b\u00e6rbuskbladflekk i solb\u00e6r. Norsk Frukt og B\u00e6r 29 (2):4-5.\u00a0</p>
statusInterpretation=Green indicates periods with no infection risk. Yellow indicates periods where some spores have been dispersed, and that infection is beginning or may have occurred. \u201cSome\u201d spore dispersal means that less than 3% of the spores (relative to the amount predicted for the entire season) have matured since the previous dispersal event. Red indicates that enough spores (\u2265 3% of the seasonal total) have matured and potentially been dispersed for a significant infection event, and that weather conditions may have allowed infection. The size (width) of the yellow and red bars indicates how long the moist conditions have been suitable for infection. The actual infection risk depends on how many spores that may have been dispersed when precipitation and moisture occur. The inoculum pressure in a given field is decisive and depends on the level of infection the previous year. The model is updated daily and shows a forecast based on recorded weather data and a 2\u2011day weather forecast. 
usage=<div>\n<p>The following inputs are required:</p>\n<p><strong>observations</strong> - an array (list) of measurement data. An observation consists of:</p>\n<ul>\n<li><strong>timeMeasured</strong> - timestamp of the measurement value</li>\n<li><strong>elementMeasurementTypeId</strong> - code for the measurement parameter</li>\n<li><strong>logIntervalId</strong> - 1 for hourly values</li>\n<li><strong>value</strong> - the value of the measured parameter</li>\n</ul>\n<p>Three different measurement parameters must be provided:</p>\n<ul>\n<li><strong>TM</strong> - Mean temperature (Celsius)</li>\n<li><strong>RR</strong> - Aggregated precipitation (millimetres)</li>\n<li><strong>BT</strong> - Leaf wetness duration (number of minutes per hour)</li>\n</ul>\n<p>All of these must be hourly data. They must all be complete time series covering exactly the same period.</p>\n</div>
