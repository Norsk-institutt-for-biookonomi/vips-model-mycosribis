name=Mycosphaerella ribis model
description=<p>Disease symptoms, sources of inoculum, and patterns of spore release of Mycosphaerella ribis, the cause of Mycosphaerella leaf spot, were studied over three years in an organic blackcurrant planting receiving no fungicide applications. In addition to typical foliar symptoms, also fruit lesions were observed on the cultivars included in the study. Ascospores from leaf litter on the ground were trapped from bud break in April to mid-to-late July, but 99% were released by one month before. Conidia formed in old fruit cluster stalks overwintering on the blackcurrant shrubs were present from bud break to early August, but 99% were trapped from late May to mid-July. Conidia were found in leaf litter but were never captured in the spore trap, and ascospores were observed in old fruit cluster stalks. Degree-day models (base = 0\u02daC) were used to estimate the proportion of mature spores. Extended periods of dry conditions slowed spore maturation in the field. Models halting degree-day accumulation after 4 or 7 days with no rain (&lt; 0.2 mm) or leaf wetness of &lt; 12 h per day, gave the best performance for release of conidia or ascospores, respectively, if validated by data from controlled conditions in the laboratory. Ascospore release was suppressed during night, and if rain and wetness started during night and continued the following day, very few spores were released before sunrise.</p>
statusInterpretation=Green means that there is no risk of an infection. Yellow means that there is some spore dispersal and that infection may have occurred, but the risk of a serious infection is low \u2013 either because the humidity conditions indicate this, or because there are too few mature spores available. Red indicates that weather conditions have been conducive to infection by the fungus, and that there are enough mature spores available for a significant attack. The actual risk in the field will of course depend on the level of inoculum pressure, which in turn depends on how much leaf spot was present the previous year. The warning model is updated daily and shows alerts based on recorded weather data up to the current date and 2\u2011day weather forecasts.
usage=<div>\n<p>The following inputs are required:</p>\n<p><strong>observations</strong> - an array (list) of measurement data. An observation consists of:</p>\n<ul>\n<li><strong>timeMeasured</strong> - timestamp of the measurement value</li>\n<li><strong>elementMeasurementTypeId</strong> - code for the measurement parameter</li>\n<li><strong>logIntervalId</strong> - 1 for hourly values</li>\n<li><strong>value</strong> - the value of the measured parameter</li>\n</ul>\n<p>Three different measurement parameters must be provided:</p>\n<ul>\n<li><strong>TM</strong> - Mean temperature (Celsius)</li>\n<li><strong>RR</strong> - Aggregated precipitation (millimetres)</li>\n<li><strong>BT</strong> - Leaf wetness duration (number of minutes per hour)</li>\n</ul>\n<p>All of these must be hourly data. They must all be complete time series covering exactly the same period.</p>\n</div>
