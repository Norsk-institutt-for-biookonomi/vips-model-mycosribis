name=Mycosphaerella ribis model
description=Disease symptoms, sources of inoculum, and patterns of spore release of Mycosphaerella ribis, the \ncause of Mycosphaerella leaf spot, were studied over three years in an organic blackcurrant planting \nreceiving no fungicide applications. In addition to typical foliar symptoms, also fruit lesions were \nobserved on the cultivars included in the study. Ascospores from leaf litter on the ground were trapped \nfrom bud break in April to mid-to-late July, but 99% were released by one month before. Conidia \nformed in old fruit cluster stalks overwintering on the blackcurrant shrubs were present from bud \nbreak to early August, but 99% were trapped from late May to mid-July. Conidia were found in leaf \nlitter but were never captured in the spore trap, and ascospores were observed in old fruit cluster \nstalks. Degree-day models (base = 0\u02daC) were used to estimate the proportion of mature spores. \nExtended periods of dry conditions slowed spore maturation in the field. Models halting degree-day \naccumulation after 4 or 7 days with no rain (< 0.2 mm) or leaf wetness of < 12 h per day, gave the best \nperformance for release of conidia or ascospores, respectively, if validated by data from controlled \nconditions in the laboratory. Ascospore release was suppressed during night, and if rain and wetness \nstarted during night and continued the following day, very few spores were released before sunrise. 
