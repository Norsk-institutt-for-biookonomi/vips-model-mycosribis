name=B\u00e6rbuskbladflekkmodell
description=<h2>Modell for b&aelig;rbuskbladflekk i solb&aelig;r</h2>\n<p><br />Modellen beskriver om det er fare for infeksjon av soppen <em>Mycosphaerella ribis</em> som er &aring;rsak til sykdommen b&aelig;rbuskbladflekk i solb&aelig;r. Modellen vil trolig ogs&aring; kunne brukes for varsling av soppen <em>Drepanopeziza ribis</em> som er &aring;rsak til b&aelig;rbuskbladfall. De to soppene har en livssyklus som er sv&aelig;rt lik og overlapper i tid for spredning og infeksjon. Det er stor forskjell i mottakelighet for b&aelig;rbuskbladflekk blant solb&aelig;rsortene som brukes i Norge, men viktige sorter som "Ben Tron" og "Ben Nare" er sv&aelig;rt mottakelige.</p>\n<p>Soppen overvintrer som sporehus i gamle blad p&aring; bakken, der det dannes askosporer som spres med vind i fuktig v&aelig;r. Den overvintrer ogs&aring; i gamle b&aelig;rklasestilker som vil henge igjen p&aring; buskene etter maskin- eller bankeh&oslash;sting, og fra disse vil det spres konidiesporer (konidier) med vannsprut i fuktig v&aelig;r. Modellen beregner sporemodning og n&aring;r det er fare for spredning av b&aring;de askosporer og konidier, noe som i stor grad vil skje samtidig. Samtidig beregner modellen n&aring;r det er fare for infeksjon.</p>\n<p><br />Sporene spres normalt fra f&oslash;r knoppsprett til midten av juni, men det vil variere mellom &aring;r. Den viktigste perioden for spredning er vanligvis fra et par uker f&oslash;r til et par uker etter blomstring. Modning av begge sporetyper i det gamle plantematerialet er avhengig av fuktighet. Hvis det er lengre perioder uten nedb&oslash;r og fuktighet, vil modningen derfor g&aring; saktere eller stoppe opp. Slike perioder med t&oslash;rt v&aelig;r er justert for i modellen. Det er en d&oslash;gnrytme i spredning av askosporer, noe som betyr at det i m&oslash;rket vil spres veldig f&aring; sporer. Dette er ikke justert for i modellen, da spredning av konidier ikke har den samme p&aring;virkningen av lys.</p>\n<p><br />Fuktighet er n&oslash;dvendig for &aring; f&aring; infeksjon, og tiden det tar for &aring; f&aring; infeksjon vil avhenge av temperaturen, med den korteste tiden rundt 20&deg;C. Det er ikke utviklet en egen modell for infeksjon av <em>M. ribis</em>, men vi bruker den samme som for epleskurvsoppen, fordi disse to soppene er n&aelig;rt i slekt med hverandre.</p>\n<p><br />Det er temperatur, nedb&oslash;r og bladfuktighet som hentes fra v&aelig;rstasjoner tilknyttet Landbruksmeteorologisk Tjeneste (LMT) og 2-d&oslash;gs v&aelig;rprognoser fra Meteorologisk institutt som er grunnlag for varslene.</p>\n<p>&nbsp;</p>\n<h2>Tolking av varsel</h2>\n<p><br />Gr&oslash;nt betyr at det ikke er fare for angrep, mens gult betyr at det er fare for et kommende angrep. R&oslash;dt vil si at det har v&aelig;rt v&aelig;rforhold som kan ha gitt infeksjon av soppen. Varslingsmodellen blir oppdatert daglig og viser varsler basert p&aring; registrerte v&aelig;rdata frem til dagens dato og 2-d&oslash;gns v&aelig;rprognoser.</p>\n<p>&nbsp;</p>\n<h2>Varslingssesong</h2>\n<p><br />Varsler startes rundt tidspunkt for knoppbryting og avsluttes i juli, det vil si en tid etter at spredningen av sporer fra det gamle plantevevet er avsluttet. N&aring;r sporemodningen er over avsluttes varselet for sesongen. Det gis ikke varsel om sekund&aelig;re infeksjoner, alts&aring; fra sporer (konidier) fra nye infeksjoner p&aring; plantene. Ta kontakt med VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) med &oslash;nske om at modellen skal settes opp for v&aelig;rstasjoner i ditt omr&aring;de.</p>\n<p><br />Varsler vises automatisk i kartfunksjonen i VIPS-forsida for alle v&aelig;rstasjoner hvor modellen er startet. Modellen kan ogs&aring; settes opp som et privat varsel med egendefinert start- og sluttdato. Dette kan gj&oslash;res for private v&aelig;rstasjoner og for v&aelig;rstasjoner som allerede finnes i LMT-databasen. Se brukerveiledning.</p>\n<p>&nbsp;</p>\n<h2>Utpr&oslash;ving og validering av modellen</h2>\n<p><br />Modellen for b&aelig;rbuskbladflekk er utviklet i Norge og er basert p&aring; data for sporemodning og -spredning under norske forhold, men det er sammenlignet med det som finnes av tilsvarende data fra arbeid med M. ribis i andre land. Del-modellene for modning/spredning av askosporer og konidiesporer er validert under norske forhold. Siden vi bruker data som er utviklet for infeksjon av epleskurvsoppen til &aring; varsle infeksjon av M. ribis, vil det v&aelig;re en viss usikkerhet i om det vil gi et korrekt bilde av infeksjonsfaren. I de aller fleste tilfeller vil likevel periodene med fuktighet vare s&aring; lenge at infeksjonsfaren er reell, og det vil uansett v&aelig;re store lokale variasjoner i fuktighet som alltid gir en grad av usikkerhet.</p>\n<p>&nbsp;</p>\n<h2>Referanse</h2>\n<p><br />Stensvand, A., Eikemo, H. &amp; Hjelkrem, A.-G., R. 2026. Mycosphaerella ribis in blackcurrant and patterns of spore release from overwintering sources of inoculum. Plant Disease. <a href="https://doi.org/10.1094/PDIS-08-25-1675-RE" target="_blank">https://doi.org/10.1094/PDIS-08-25-1675-RE</a></p>
statusInterpretation=Gr&oslash;nt betyr at det ikke er fare for angrep, mens gult betyr at det er fare for et kommende angrep. R&oslash;dt vil si at det har v&aelig;rt v&aelig;rforhold som kan ha gitt infeksjon av soppen. Varslingsmodellen blir oppdatert daglig og viser varsler basert p&aring; registrerte v&aelig;rdata frem til dagens dato og 2-d&oslash;gns v&aelig;rprognoser.
usage=<p>F&oslash;lgende input kreves:</p>\n<p><br /><strong>observations</strong> - array (liste) over m&aring;ledata. En observasjon best&aring;r av:<br /><strong>timeMeasured</strong> - m&aring;leverdiens tidsstempel<br /><strong>elementMeasurementTypeId</strong> - kode for m&aring;leparameter<br /><strong>logIntervalId</strong> - 1 for timeverdi<br /><strong>value</strong> - verdien p&aring; den m&aring;lte parameteren</p>\n<p><br />Tre forskjellige m&aring;leparametre m&aring; sendes inn:</p>\n<ul>\n<li><strong>TM</strong> - Middeltemperatur (Celcius)</li>\n<li><strong>RR</strong> - Aggrebert nedb&oslash;r (Millimeter)</li>\n<li><strong>BT</strong> - Bladfukt (antall minutter/time)</li>\n</ul>\n<p>Disse m&aring; alle v&aelig;re timedata. De m&aring; alle v&aelig;re komplette tidsserier i eksakt samme periode.</p>\n
