name=B\u00e6rbuskbladflekkmodell
description=NB! Oversatt med Copilot)\\n S\nykdomssymptomer, kilder til inokulum og m\u00f8nstre for sporeslipp hos Mycosphaerella ribis, \u00e5rsaken til Mycosphaerella-bladflekk, ble studert over tre \u00e5r i en \u00f8kologisk solb\u00e6rplanting uten bruk av fungicider. I tillegg til typiske blad-symptomer ble det ogs\u00e5 observert fruktlesjoner p\u00e5 sortene som inngikk i studien. Ascosporer fra bladrester p\u00e5 bakken ble fanget fra knoppsprett i april til midten\u2013slutten av juli, men 99 % ble frigitt innen \u00e9n m\u00e5ned f\u00f8r dette tidspunktet. Konidier som ble dannet i gamle fruktklasestilker som overvintret p\u00e5 solb\u00e6rbuskene, var til stede fra knoppsprett til begynnelsen av august, men 99 % ble fanget fra slutten av mai til midten av juli. Konidier ble funnet i bladrester, men ble aldri fanget i sporefellen, og ascosporer ble observert i gamle fruktklasestilker. Graddagsmodeller (basis = 0 \u00b0C) ble brukt til \u00e5 estimere andelen modne sporer. Lengre perioder med t\u00f8rre forhold forsinket sporemognaden i felt. Modeller som stoppet akkumuleringen av graddager etter 4 eller 7 dager uten regn (< 0,2 mm) eller med bladv\u00e6te p\u00e5 < 12 timer per dag, ga best resultat for henholdsvis frigivelse av konidier og ascosporer, n\u00e5r de ble validert med data fra kontrollerte laboratorieforhold. Frigivelse av ascosporer var undertrykt om natten, og dersom regn og fuktighet startet om natten og fortsatte dagen etter, ble det frigitt sv\u00e6rt f\u00e5 sporer f\u00f8r soloppgang.
