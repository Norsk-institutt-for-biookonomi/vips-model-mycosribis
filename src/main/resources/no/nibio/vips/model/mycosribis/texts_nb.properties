name=B\u00e6rbuskbladflekkmodell
description=<p>Modellen viser om det er fare for infeksjon av soppen\u202f<em>Mycosphaerella ribis\u202f</em>som er \u00e5rsak til sjukdomen b\u00e6rbuskbladflekk i solb\u00e6r. Modellen vil truleg ogs\u00e5 kunne brukast for varsling av soppen\u202f<em>Drepanopeziza ribis</em>\u202fsom er \u00e5rsak til b\u00e6rbuskbladfall i den same kulturen. Dei to soppane har ein livssyklus som er sv\u00e6rt lik og overlappar i tid for sporespreiing og infeksjon. Det er stor skilnad i mottakeligheit for b\u00e6rbuskbladflekk hos solb\u00e6rsortar brukt i Noreg, men viktige sortar som \u2018Ben Tron\u2019 og \u2018Ben Nare\u2019 er sv\u00e6rt mottakelege.</p>\n<p>Soppen overvintrar som sporehus i gamle blad p\u00e5 bakken, der det vert danna askosporer som spreier seg med vind i fuktig v\u00ear om v\u00e5ren. Han overvintrar ogs\u00e5 i gamle b\u00e6rklasestilker som heng att p\u00e5 buskane etter maskin- eller bankehausting, og fr\u00e5 desse vil det verta spreidd konidiesporar (konidiar) med vassprut. Modellen skildrar sporemodninga og n\u00e5r det er fare for spreiing av b\u00e5de askosporar og konidiar, noko som i stor grad vil skje i same periode om v\u00e5ren. Samtidig viser modellen n\u00e5r det er fare for infeksjon.</p>\n<p>{{filename="/images/description_figure_1.png" description="Fotografier av b\u00e6rbuskbladflekk i solb\u00e6r"}}</p>\n<p><em>Fig 1. B\u00e6rbuskbladflekk p\u00e5 nye, gr\u00f8ne blad (A); smitten om v\u00e5ren kjem fr\u00e5 askosporar danna i sporehus i gamle blad p\u00e5 bakken (B) og konidiesporar danna i gamle b\u00e6rklasestilkar p\u00e5 skota (C). Foto: A. Stensvand.\u00a0</em></p>\n<p>Sporane vert normalt spreidde fr\u00e5 f\u00f8r knoppsprett til midten av juni, men dette vil variera noko mellom \u00e5r. Den viktigaste perioden for spreiing er gjerne fr\u00e5 eit par veker f\u00f8r til eit par veker etter blomstring. Modning av begge sporetypar i det gamle plantematerialet er avhengig av fuktigheit. Viss det er lengre perioder utan nedb\u00f8r og fuktigheit, vil modninga difor g\u00e5 seinare eller stoppa opp. Slike perioder med t\u00f8rt v\u00ear er justert for i modellen. Det er ein d\u00f8gnrytme i spreiing av askosporar, med langt mindre sporespreiing om natta enn om dagen. Dette er ikkje justert for i modellen, fordi spreiing av konidiar ikkje vert p\u00e5verka av lyset.</p>\n<p>Fuktigheit er n\u00f8dvendig for \u00e5 f\u00e5 infeksjon, og tida det tar avheng av temperaturen, med den kortaste infeksjonstida rundt 20\u00b0C. Det er ikkje utvikla ein eigen modell for infeksjon av\u202fM. ribis, men vi brukar den same som for epleskurvsoppen, fordi desse to soppane er n\u00e6rt i slekt med kvarandre, og dei har truleg sv\u00e6rt lik infeksjonstid.</p>\n<h2>Tolking av varsel</h2>\n<p>Gr\u00f8nt markerer tidsrom der det ikkje er fare for angrep. Gult viser tidsrom der det har vore litt sporespreiing, og det er i ferd med eller kan ha skjedd infeksjon. \u00abLitt\u00bb sporespreiing vil seia at det er mindre enn 3% sporar (i h\u00f8ve til det som er predikert for heile sesongen) som er modne sidan forrige sporespreiing. Raudt vil seia at det er nok modne sporar (\u2265 3% av totalt i sesongen) for eit monaleg angrep, og det har vore v\u00eartilh\u00f8ve som kan ha gitt infeksjon av soppen. Storleiken (breidda) av dei gule og raude felta viser kor lenge det har vore fuktige tilh\u00f8ve som kan gi infeksjon. Den reelle faren for angrep vil sj\u00f8lvsagt avhenga av kor mange sporar som er modne og har spreidd seg n\u00e5r det er nedb\u00f8r og fuktige tilh\u00f8ve. Der vil smittepresset i det enkelte feltet vera avgjerande, noko som vil avhenga av kor mykje angrep det var av soppen \u00e5ret f\u00f8r. Varslingsmodellen vert oppdatert dagleg og viser varsel basert p\u00e5 registrerte v\u00eardata og 2-d\u00f8gns v\u00earprognosar.</p>\n<p>{{filename="/images/description_figure_2.png" description="Diagram med resultater fra varslingsmodell for b\u00e6rbuskbladflekk i solb\u00e6r"}}</p>\n<p><em>Fig. 2. Varslingsmodell for b\u00e6rbuskbladflekk med data fr\u00e5 ein v\u00earstasjon i S\u00f8r-Noreg i 2025: Prosent modning av askosporar fr\u00e5 gamle blad (m\u00f8rk bl\u00e5 linje) og konidiesporar fr\u00e5 gamle b\u00e6rklasestilkar (lys bl\u00e5 linje); n\u00e5r akkumulert risiko for infeksjon basert p\u00e5 m\u00e5ling av temperatur og bladfukt (svart linje) passerer gul og raud horisontal strek, vil det vera moderat (gult vertikalt felt) eller h\u00f8g (raudt vertikalt felt) infeksjonsrisiko (m\u00e5lt som Risikoverdi).</em></p>\n<h2>Varslingssesong</h2>\n<p>Varsla vert starta rundt tidspunkt for knoppbryting og vert avslutta rett etter at spreiinga av sporar fr\u00e5 det gamle plantevevet er avslutta, som regel i juni. Det vert ikkje gitt varsel om sekund\u00e6re infeksjonar, alts\u00e5 fr\u00e5 sporar (konidiar) fr\u00e5 nye infeksjonar p\u00e5 plantene.</p>\n<h2>Tilknytting av v\u00earstasjonar</h2>\n<p>Ta kontakt med VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) om det er \u00f8nskje om at modellen skal setjast opp for v\u00earstasjonar i ditt omr\u00e5de. Varsla vert automatisk vist i kartfunksjonen p\u00e5 VIPS-forsida for alle v\u00earstasjonar der modellen er starta. Modellen kan ogs\u00e5 setjast opp som eit privat varsel med eigendefinert start- og sluttdato. Dette kan gjerast for private v\u00earstasjoner og for v\u00earstasjoner som allereie er i LMT-databasen. Sj\u00e5 <a href="https://www.vips-landbruk.no/information/35/" target="_blank">brukarrettleiing</a>.</p>\n<h2>Utpr\u00f8ving og validering av modellen</h2>\n<p>Modellen for b\u00e6rbuskbladflekk er utvikla i Noreg og er basert p\u00e5 data for sporemodning og -spreiing under norske tilh\u00f8ve, men det er samanlikna med tilsvarande arbeid med <em>M. ribis</em> i andre land. Del-modellane for modning/spreiing av askosporar og konidiar er validert under norske tilh\u00f8ve. Sidan vi brukar data som er utvikla for infeksjon av epleskurvsoppen til \u00e5 varsla infeksjon av <em>M. ribis</em>, vil det vera ei viss usikkerheit i om det vil gi eit korrekt bilete av infeksjonsfaren. I dei aller fleste tilfelle vil likevel periodane med fuktigheit vara s\u00e5 lenge at infeksjonsfaren er reell. Og det vil uansett vera store lokale variasjonar i fuktigheit etter nedb\u00f8r som alltid gir ein grad av usikkerheit.</p>\n<h2>Referanse</h2>\n<p>Stensvand, A., Eikemo, H. &amp; Hjelkrem, A.-G., R. 2026. Mycosphaerella ribis in blackcurrant and patterns of spore release from overwintering sources of inoculum. Plant Disease.\u202f<a href="https://doi.org/10.1094/PDIS-08-25-1675-RE" target="_blank">https://doi.org/10.1094/PDIS-08-25-1675-RE</a></p>
statusInterpretation=Gr&oslash;nt markerer tidsrom der det ikkje er fare for angrep. Gult viser tidsrom der det har vore litt sporespreiing, og det er i ferd med eller kan ha skjedd infeksjon. &laquo;Litt&raquo; sporespreiing vil seia at det er mindre enn 3% sporar (i h&oslash;ve til det som er predikert for heile sesongen) som er modne sidan forrige sporespreiing. Raudt vil seia at det er nok modne sporar (&ge; 3% av totalt i sesongen) for eit monaleg angrep, og det har vore v&ecirc;rtilh&oslash;ve som kan ha gitt infeksjon av soppen. Storleiken (breidda) av dei gule og raude felta viser kor lenge det har vore fuktige tilh&oslash;ve som kan gi infeksjon. Den reelle faren for angrep vil sj&oslash;lvsagt avhenga av kor mange sporar som er modne og har spreidd seg n&aring;r det er nedb&oslash;r og fuktige tilh&oslash;ve. Der vil smittepresset i det enkelte feltet vera avgjerande, noko som vil avhenga av kor mykje angrep det var av soppen &aring;ret f&oslash;r.
usage=<p>F&oslash;lgende input kreves:</p>\n<p><br /><strong>observations</strong> - array (liste) over m&aring;ledata. En observasjon best&aring;r av:<br /><strong>timeMeasured</strong> - m&aring;leverdiens tidsstempel<br /><strong>elementMeasurementTypeId</strong> - kode for m&aring;leparameter<br /><strong>logIntervalId</strong> - 1 for timeverdi<br /><strong>value</strong> - verdien p&aring; den m&aring;lte parameteren</p>\n<p><br />Tre forskjellige m&aring;leparametre m&aring; sendes inn:</p>\n<ul>\n<li><strong>TM</strong> - Middeltemperatur (Celcius)</li>\n<li><strong>RR</strong> - Aggrebert nedb&oslash;r (Millimeter)</li>\n<li><strong>BT</strong> - Bladfukt (antall minutter/time)</li>\n</ul>\n<p>Disse m&aring; alle v&aelig;re timedata. De m&aring; alle v&aelig;re komplette tidsserier i eksakt samme periode.</p>\n
