name=B\u00e6rbuskbladflekkmodell
description=<p>Modellen viser om det er fare for infeksjon av soppen\u202f<em>Mycosphaerella ribis\u202f</em>som er &aring;rsak til sjukdomen b&aelig;rbuskbladflekk i solb&aelig;r. Modellen vil truleg ogs&aring; kunne brukast for varsling av soppen\u202f<em>Drepanopeziza ribis</em>\u202fsom er &aring;rsak til b&aelig;rbuskbladfall i den same kulturen. Dei to soppane har ein livssyklus som er sv&aelig;rt lik og overlappar i tid for sporespreiing og infeksjon. Det er stor skilnad i mottakeligheit for b&aelig;rbuskbladflekk hos solb&aelig;rsortar brukt i Noreg, men viktige sortar som &lsquo;Ben Tron&rsquo; og &lsquo;Ben Nare&rsquo; er sv&aelig;rt mottakelege.</p>\n<p>Soppen overvintrar som sporehus i gamle blad p&aring; bakken, der det vert danna askosporer som spreier seg med vind i fuktig v&ecirc;r om v&aring;ren. Han overvintrar ogs&aring; i gamle b&aelig;rklasestilker som heng att p&aring; buskane etter maskin- eller bankehausting, og fr&aring; desse vil det verta spreidd konidiesporar (konidiar) med vassprut. Modellen skildrar sporemodninga og n&aring;r det er fare for spreiing av b&aring;de askosporar og konidiar, noko som i stor grad vil skje i same periode om v&aring;ren. Samtidig viser modellen n&aring;r det er fare for infeksjon.</p>\n<p>Sporane vert normalt spreidde fr&aring; f&oslash;r knoppsprett til midten av juni, men dette vil variera noko mellom &aring;r. Den viktigaste perioden for spreiing er gjerne fr&aring; eit par veker f&oslash;r til eit par veker etter blomstring. Modning av begge sporetypar i det gamle plantematerialet er avhengig av fuktigheit. Viss det er lengre perioder utan nedb&oslash;r og fuktigheit, vil modninga difor g&aring; seinare eller stoppa opp. Slike perioder med t&oslash;rt v&ecirc;r er justert for i modellen. Det er ein d&oslash;gnrytme i spreiing av askosporar, med langt mindre sporespreiing om natta enn om dagen. Dette er ikkje justert for i modellen, fordi spreiing av konidiar ikkje vert p&aring;verka av lyset.</p>\n<p>Fuktigheit er n&oslash;dvendig for &aring; f&aring; infeksjon, og tida det tar avheng av temperaturen, med den kortaste infeksjonstida rundt 20&deg;C. Det er ikkje utvikla ein eigen modell for infeksjon av\u202fM. ribis, men vi brukar den same som for epleskurvsoppen, fordi desse to soppane er n&aelig;rt i slekt med kvarandre, og dei har truleg sv&aelig;rt lik infeksjonstid.</p>\n<h2>Tolking av varsel</h2>\n<p>Gr&oslash;nt markerer tidsrom der det ikkje er fare for angrep. Gult viser tidsrom der det har vore litt sporespreiing, og det er i ferd med eller kan ha skjedd infeksjon. &laquo;Litt&raquo; sporespreiing vil seia at det er mindre enn 3% sporar (i h&oslash;ve til det som er predikert for heile sesongen) som er modne sidan forrige sporespreiing. Raudt vil seia at det er nok modne sporar (&ge; 3% av totalt i sesongen) for eit monaleg angrep, og det har vore v&ecirc;rtilh&oslash;ve som kan ha gitt infeksjon av soppen. Storleiken (breidda) av dei gule og raude felta viser kor lenge det har vore fuktige tilh&oslash;ve som kan gi infeksjon. Den reelle faren for angrep vil sj&oslash;lvsagt avhenga av kor mange sporar som er modne og har spreidd seg n&aring;r det er nedb&oslash;r og fuktige tilh&oslash;ve. Der vil smittepresset i det enkelte feltet vera avgjerande, noko som vil avhenga av kor mykje angrep det var av soppen &aring;ret f&oslash;r. Varslingsmodellen vert oppdatert dagleg og viser varsel basert p&aring; registrerte v&ecirc;rdata og 2-d&oslash;gns v&ecirc;rprognosar.</p>\n<p>{{filename="/images/description_figure_2.png" description="Diagram med resultater fra varslingsmodell for b\u00e6rbuskbladflekk i solb\u00e6r"}}</p>\n<p>Fig. 2. Varslingsmodell for b&aelig;rbuskbladflekk med data fr&aring; ein v&ecirc;rstasjon i S&oslash;r-Noreg i 2025: Prosent modning av askosporar fr&aring; gamle blad (m&oslash;rk bl&aring; linje) og konidiesporar fr&aring; gamle b&aelig;rklasestilkar (lys bl&aring; linje); n&aring;r akkumulert risiko for infeksjon basert p&aring; m&aring;ling av temperatur og bladfukt (svart linje) passerer gul og raud horisontal strek, vil det vera moderat (gult vertikalt felt) eller h&oslash;g (raudt vertikalt felt) infeksjonsrisiko (m&aring;lt som Risikoverdi).</p>\n<h2>Varslingssesong</h2>\n<p>Varsla vert starta rundt tidspunkt for knoppbryting og vert avslutta rett etter at spreiinga av sporar fr&aring; det gamle plantevevet er avslutta, som regel i juni. Det vert ikkje gitt varsel om sekund&aelig;re infeksjonar, alts&aring; fr&aring; sporar (konidiar) fr&aring; nye infeksjonar p&aring; plantene.</p>\n<h2>Tilknytting av v&ecirc;rstasjonar</h2>\n<p>Ta kontakt med VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) om det er &oslash;nskje om at modellen skal setjast opp for v&ecirc;rstasjonar i ditt omr&aring;de. Varsla vert automatisk vist i kartfunksjonen p&aring; VIPS-forsida for alle v&ecirc;rstasjonar der modellen er starta. Modellen kan ogs&aring; setjast opp som eit privat varsel med eigendefinert start- og sluttdato. Dette kan gjerast for private v&ecirc;rstasjoner og for v&ecirc;rstasjoner som allereie er i LMT-databasen. Sj&aring; <a href="https://www.vips-landbruk.no/information/35/" target="_blank">brukarrettleiing</a>.</p>\n<h2>Utpr&oslash;ving og validering av modellen</h2>\n<p>Modellen for b&aelig;rbuskbladflekk er utvikla i Noreg og er basert p&aring; data for sporemodning og -spreiing under norske tilh&oslash;ve, men det er samanlikna med tilsvarande arbeid med <em>M. ribis</em> i andre land. Del-modellane for modning/spreiing av askosporar og konidiar er validert under norske tilh&oslash;ve. Sidan vi brukar data som er utvikla for infeksjon av epleskurvsoppen til &aring; varsla infeksjon av <em>M. ribis</em>, vil det vera ei viss usikkerheit i om det vil gi eit korrekt bilete av infeksjonsfaren. I dei aller fleste tilfelle vil likevel periodane med fuktigheit vara s&aring; lenge at infeksjonsfaren er reell. Og det vil uansett vera store lokale variasjonar i fuktigheit etter nedb&oslash;r som alltid gir ein grad av usikkerheit.</p>\n<h2>Referanse</h2>\n<p>Stensvand, A., Eikemo, H. &amp; Hjelkrem, A.-G., R. 2026. Mycosphaerella ribis in blackcurrant and patterns of spore release from overwintering sources of inoculum. Plant Disease.\u202f<a href="https://doi.org/10.1094/PDIS-08-25-1675-RE" target="_blank">https://doi.org/10.1094/PDIS-08-25-1675-RE</a></p>
